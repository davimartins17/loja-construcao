server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loja_construcao}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:davi}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-this-before-production-123456789}
    expiration-ms: 86400000
