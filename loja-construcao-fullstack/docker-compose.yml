services:
  db:
    image: postgres:16
    container_name: loja-db
    environment:
      POSTGRES_DB: loja_construcao
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja -d loja_construcao"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/loja_construcao
      DB_USER: loja
      DB_PASSWORD: loja_dev
      JWT_SECRET: "dev-only-secret-key-change-this-before-production-123456789"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
